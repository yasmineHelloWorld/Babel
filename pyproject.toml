[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babel-symbolic-language"
version = "0.1.0"
description = "A reproducible toy environment for emergent symbolic communication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.scripts]
babel = "babel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

